name: Refresh profile stats
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: write

concurrency:
  group: profile-stats

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read GitHub statistics
        run: python3 .github/scripts/refresh_stats.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish updated statistics
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh profile statistics'
          git push
